# Deploy (Coolify) a cada push na main + confirmação de que o build acabou bem.
#
# Porque existe: o painel do Coolify vive dentro da WireGuard, por isso o
# webhook do GitHub nunca lhe chega — sem isto o deploy é sempre manual.
# Mesmo padrão do CI do Backoffice. Passo-a-passo do setup: CI-SETUP.md na raiz
# da plataforma → "Sites externos".
#
# Setup (uma vez, em Settings → Secrets and variables → Actions deste repo):
#   secrets:   WIREGUARD_CONFIG    — wg0.conf do peer dos SITES (não o da API/BO)
#              COOLIFY_DEPLOY_HOOK — URL de deploy desta app no Coolify
#              COOLIFY_TOKEN       — token da API do Coolify (Bearer)
#   variables: DEPLOY_ENABLED = true   (enquanto não estiver, o job não corre)
#              SITE_URL (opcional)     — https://<domínio>; com ela o job confirma que o site responde
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # botão "Run workflow" para um redeploy à mão

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (Coolify) e confirmação
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Entrar na rede WireGuard (o painel do Coolify não é público)
        env:
          WG_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          if [ -z "$WG_CONFIG" ]; then
            echo "::error::Falta o secret WIREGUARD_CONFIG — o runner não alcança o Coolify."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

          # Esperar pelo handshake: `wg-quick up` devolve 0 mesmo com chaves erradas.
          for i in $(seq 1 10); do
            hs=$(sudo wg show wg0 latest-handshakes | awk '{print $2}' | head -1)
            [ -n "$hs" ] && [ "$hs" != "0" ] && break
            sleep 3
          done
          if [ -z "$hs" ] || [ "$hs" = "0" ]; then
            echo "::error::Túnel sem handshake ao fim de 30s. Causas prováveis: AllowedIPs estreito (tem de ser 0.0.0.0/0), peer apagado no wg-easy, porta UDP, ou outro runner a usar o mesmo peer neste minuto."
            sudo wg show wg0 | sed 's/(none)//'
            exit 1
          fi
          echo "Handshake OK."

      - name: Disparar deploy no Coolify
        id: trigger
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_HOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Falta o secret COOLIFY_DEPLOY_HOOK."; exit 1; fi
          resp=$(curl --fail --silent --show-error "$HOOK" ${TOKEN:+-H "Authorization: Bearer $TOKEN"})
          echo "$resp"
          dep=$(printf '%s' "$resp" | grep -o '"deployment_uuid":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "deployment_uuid=$dep" >> "$GITHUB_OUTPUT"
          # A base da API do Coolify é a do próprio hook (http://<ip-interno>:8000).
          echo "base=$(printf '%s' "$HOOK" | sed -E 's#^(https?://[^/]+).*#\1#')" >> "$GITHUB_OUTPUT"

      # "Deployment queued" não diz se o build passou: acompanha até acabar e, se falhar, mostra o fim do log aqui.
      - name: Acompanhar o deploy no Coolify (estado; log se falhar)
        env:
          BASE: ${{ steps.trigger.outputs.base }}
          DEP: ${{ steps.trigger.outputs.deployment_uuid }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$DEP" ] || [ -z "$TOKEN" ]; then
            echo "::warning::Sem deployment_uuid ou sem COOLIFY_TOKEN — deploy disparado, mas não dá para confirmar o fim."
            exit 0
          fi
          st=""
          for i in $(seq 1 90); do
            body=$(curl -sS "$BASE/api/v1/deployments/$DEP" -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" || true)
            st=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)
            echo "[$i] estado=${st:-?}"
            case "$st" in
              finished) echo "✔ Coolify: deploy terminado."; exit 0 ;;
              failed|cancelled*|canceled*)
                echo "::error::Coolify: deploy $st. Fim do log:"
                printf '%s' "$body" | jq -r '.logs | (try fromjson catch []) | map(select(.hidden != true) | .output) | .[-120:] | .[]' 2>/dev/null || printf '%s\n' "$body" | tail -c 4000
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Coolify: o deploy não terminou em ~22 min (estado: ${st:-?})."; exit 1

      # Liveness só: estes sites não publicam o commit. Sem SITE_URL, salta.
      - name: Confirmar que o site responde
        env:
          URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "Sem a variable SITE_URL — salto a confirmação."; exit 0; fi
          URL="${URL%/}"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/root -w '%{http_code}' "$URL/?_=$i" || echo 000)
            echo "[$i] http=$code"
            if [ "$code" = "200" ] && grep -q 'id="root"' /tmp/root; then echo "✔ $URL responde."; exit 0; fi
            sleep 6
          done
          echo "::error::$URL não respondeu 200 com a app depois do deploy."; exit 1
